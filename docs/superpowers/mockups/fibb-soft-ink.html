<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fibb · Soft Ink direction</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4fb;--bg2:#fdfbf7;--card:rgba(255,255,255,.72);--solid:#fff;--text:#1f2238;--text2:#5b5f7a;--text3:#9396ad;
--ink:#5b6fd6;--ink2:#7f92ee;--inkdim:rgba(91,111,214,.10);--peach:#f3b57e;--line:rgba(40,45,90,.08);
--glow1:rgba(127,146,238,.38);--glow2:rgba(255,182,158,.34);--shadow:0 10px 40px rgba(60,70,140,.12),0 1px 2px rgba(60,70,140,.06);
--ease:cubic-bezier(.22,1,.36,1)}
[data-theme=dark]{--bg:#0f1120;--bg2:#141629;--card:rgba(30,33,58,.62);--solid:#1b1e36;--text:#eef0fb;--text2:#a9adc9;--text3:#6c7093;
--ink:#8b9cf4;--ink2:#a9b6ff;--inkdim:rgba(139,156,244,.14);--line:rgba(255,255,255,.07);
--glow1:rgba(91,111,214,.34);--glow2:rgba(243,181,126,.16);--shadow:0 12px 44px rgba(0,0,0,.42)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--text);background:linear-gradient(180deg,var(--bg),var(--bg2));overflow:hidden;transition:background .5s,color .3s;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.blob{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;transition:background .5s}
.b1{width:560px;height:560px;left:50%;top:-180px;margin-left:-380px;background:var(--glow1);animation:drift 16s ease-in-out infinite alternate}
.b2{width:460px;height:460px;left:50%;top:-80px;margin-left:60px;background:var(--glow2);animation:drift 20s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(40px,30px) scale(1.08)}}
.app{position:relative;height:100%;display:flex}
.dock{margin:auto 0 auto 18px;padding:10px;border-radius:28px;background:var(--card);backdrop-filter:blur(20px);box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.dock button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text3);transition:all .25s var(--ease)}
.dock button:hover{color:var(--text);background:var(--inkdim);transform:scale(1.06)}
.dock button.on{background:var(--ink);color:#fff;box-shadow:0 6px 18px var(--glow1)}
.dock svg,.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{position:absolute;top:18px;right:22px;display:flex;gap:8px;align-items:center}
.chipx{height:38px;padding:0 14px;border-radius:999px;background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:7px;transition:transform .25s var(--ease)}
.chipx:hover{transform:translateY(-1px)}.chipx b{color:var(--ink)}
.brand{position:absolute;top:24px;left:96px;font-weight:700;letter-spacing:-.01em;display:flex;gap:8px;align-items:center}
.beta{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--ink);background:var(--inkdim);padding:3px 8px;border-radius:999px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;padding:0 20px}
.stage{flex:1;width:100%;max-width:720px;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:all .6s var(--ease);min-height:0}
.chatting .stage{justify-content:flex-start;padding-top:70px}
.nib{width:148px;height:148px;position:relative;transition:all .6s var(--ease);flex:0 0 auto}
.nib::before{content:"";position:absolute;inset:8% 8% -4%;border-radius:50%;background:radial-gradient(closest-side,var(--glow1),transparent);filter:blur(14px)}
.nib img{position:absolute;inset:0;width:100%;height:100%;animation:float 5s ease-in-out infinite;transition:opacity .35s}
.nib img+img{opacity:0}.think .nib img{opacity:0}.think .nib img+img{opacity:1}
@keyframes float{50%{transform:translateY(-7px)}}
.chatting .nib{width:72px;height:72px}
h1{font-size:38px;line-height:1.15;letter-spacing:-.03em;font-weight:600;margin:18px 0 6px;text-align:center}
h1 span{background:linear-gradient(90deg,var(--ink),var(--peach));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--text2);font-size:16px;margin:0 0 28px;text-align:center}
.chatting h1,.chatting .sub,.chatting .cards{display:none}
.status{display:none;font-size:13px;color:var(--text2);margin-top:6px;font-weight:500}.chatting .status{display:block}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.cardx{text-align:left;padding:16px;border-radius:24px;background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--line);transition:all .3s var(--ease);animation:rise .7s var(--ease) backwards}
.cardx:nth-child(2){animation-delay:.07s}.cardx:nth-child(3){animation-delay:.14s}
.cardx:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.cardx .ic{width:36px;height:36px;border-radius:12px;background:var(--inkdim);color:var(--ink);display:grid;place-items:center;margin-bottom:12px;flex:0 0 auto}
.cardx b{display:block;font-size:14px;font-weight:600}.cardx small{color:var(--text2);font-size:12.5px;line-height:1.45;display:block;margin-top:3px}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}
.thread{width:100%;display:none;flex-direction:column;gap:16px;margin-top:22px;overflow:auto;padding-bottom:10px}
.chatting .thread{display:flex}
.m{animation:rise .55s var(--ease) backwards;font-size:16px;line-height:1.65;max-width:88%}
.m.me{align-self:flex-end;background:var(--ink);color:#fff;padding:11px 18px;border-radius:24px 24px 8px 24px;box-shadow:0 8px 22px var(--glow1)}
.m.f{align-self:flex-start}
.task{margin-top:12px;padding:14px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(20px);display:flex;gap:12px;align-items:center;font-size:14px}
.ring{width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--ink) 62%,var(--inkdim) 0);display:grid;place-items:center;flex:0 0 auto}.ring i{width:24px;height:24px;border-radius:50%;background:var(--solid)}
.task small{color:var(--text2);display:block;font-size:12px}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink2);margin-right:5px;animation:dot 1.1s ease-in-out infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{transform:translateY(-6px);opacity:.5}}
.comp{width:100%;max-width:720px;margin:14px 0 26px;padding:8px 8px 8px 22px;border-radius:32px;background:var(--solid);box-shadow:var(--shadow);border:1px solid var(--line);display:flex;align-items:center;gap:8px;transition:box-shadow .3s,transform .3s var(--ease)}
.comp:focus-within{box-shadow:0 0 0 4px var(--inkdim),var(--shadow);transform:translateY(-1px)}
.comp input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--text);height:44px;min-width:0}
.comp input::placeholder{color:var(--text3)}
.rb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text2);transition:all .25s var(--ease);flex:0 0 auto}
.rb:hover{background:var(--inkdim);color:var(--ink)}
.rb.send{background:linear-gradient(135deg,var(--ink2),var(--ink));color:#fff;box-shadow:0 6px 16px var(--glow1)}.rb.send:hover{transform:scale(1.07)}.rb.send:active{transform:scale(.94)}
.note{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:var(--text3)}
@media(max-width:760px){.dock{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);flex-direction:row;margin:0;z-index:5}.brand{left:20px}.cards{grid-template-columns:1fr}.cardx{display:flex;gap:12px;align-items:center;padding:12px}.cardx .ic{margin:0}h1{font-size:28px}.nib{width:104px;height:104px}.comp{margin-bottom:84px}.note{display:none}.chipx.t{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body data-theme="light">

document.getElementById('theme').onclick=e=>{const d=document.body.dataset.theme==='dark';document.body.dataset.theme=d?'light':'dark';e.target.textContent=d?'◐ Dark':'◑ Light'};
function add(c,h){const d=document.createElement('div');d.className='m '+c;d.innerHTML=h;th.appendChild(d);th.scrollTop=1e6;return d}
function say(q){if(!q)return;app.classList.add('chatting');const u=add('me','');u.textContent=q;app.classList.add('think');st.textContent='Fibb · thinking…';const t=add('f','<span class="dots"><span></span><span></span><span></span></span>');
setTimeout(()=>{app.classList.remove('think');st.textContent='Fibb · awake';t.innerHTML="On it. Mara is at the gate with the forged pass, and you left a note that the guard should recognize her voice. Want me to read the last paragraph aloud first?<div class='task'><div class='ring'><i></i></div><div>Plot-hole pass on chapters 1 to 9<small>Night shift · 62% · you review in the morning</small></div></div>"},1400)}
document.querySelectorAll('.cardx').forEach(c=>c.onclick=()=>say(c.dataset.q));
const inp=document.getElementById('inp');document.getElementById('send').onclick=()=>{say(inp.value.trim());inp.value=''};inp.onkeydown=e=>{if(e.key==='Enter'){say(inp.value.trim());inp.value=''}};
</script></body></html>
